input[type=range]{width:100%}

.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:600;width:100%}
.btn.g{background:var(--pn);color:var(--tx);border:1px solid var(--bd);font-weight:500;font-size:13px}
.note{font-size:12px;opacity:.65;text-align:center;line-height:1.5}
</style>
</head>
